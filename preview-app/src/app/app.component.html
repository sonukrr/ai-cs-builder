<!--
  The page is a tree, not a list: a section whose source is "layout" owns its
  own children. SectionHostComponent renders one node of that tree and recurses,
  so this template only has to hand it the sections sitting directly on the page.
-->

<div class="preview-status" *ngIf="loading">Loading the site…</div>

<div class="preview-error" *ngIf="error">{{ error }}</div>

<div class="preview-mode" *ngIf="!loading && !error" [title]="dataSourceDetail">
  {{ dataSourceLabel }}
</div>

<main *ngIf="page" class="page">
  <app-section-host
    *ngFor="let section of visibleSections"
    [section]="section"
    [selectedId]="selectedId"
    [blueprint]="blueprint"
    [config]="config"
    (select)="select($event)"
  ></app-section-host>
</main>
